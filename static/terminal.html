<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PiCore">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <script src="/static/theme.js"></script>
  <title>Terminal | PiCore Server</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-cyber terminal-page">
  <header class="app-header">
    <div class="header-left">
      <a class="back-link" href="/" title="Zurück zum Dashboard">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
        <span>Dashboard</span>
      </a>
      <h1 class="settings-title" id="term-title">Terminal</h1>
      <span class="health-tag" id="term-status">Nicht verbunden</span>
    </div>
    <div class="header-right">
      <button class="icon-button" id="btn-palette" title="Suchen &amp; Befehle" aria-label="Suchen &amp; Befehle">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.35-4.35"></path></svg>
      </button>
      <div class="term-snippets-wrap">
        <button class="btn-secondary" id="term-snippets" type="button" aria-haspopup="true" aria-expanded="false" hidden>Befehle</button>
        <div class="term-snippets" id="term-snippets-menu" hidden>
          <input type="search" id="term-snippets-q" placeholder="Befehl suchen…" autocomplete="off" spellcheck="false" aria-label="Befehl suchen">
          <div class="term-snippets-list" id="term-snippets-list"></div>
          <a class="term-snippets-manage" href="/doku#befehle">Befehle verwalten →</a>
        </div>
      </div>
      <button class="btn-secondary" id="term-reconnect" hidden>Neu verbinden</button>
      <div class="user-chip" id="user-chip" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span id="user-name"></span>
      </div>
    </div>
  </header>

  <main class="terminal-wrap">
    <form class="glass-card login-card terminal-unlock" id="term-unlock" autocomplete="off">
      <div class="login-brand">
        <div class="card-icon-pill icon-violet">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
        </div>
        <div>
          <h1 id="term-unlock-title">Terminal öffnen</h1>
          <p class="card-subtitle">Zur Sicherheit bitte das Passwort erneut eingeben.</p>
        </div>
      </div>
      <label class="login-field">
        <span>Passwort</span>
        <input type="password" id="term-password" autocomplete="current-password" required>
      </label>
      <div class="login-error" id="term-error" role="alert" hidden></div>
      <button type="submit" class="login-submit" id="term-open">Terminal öffnen</button>
      <p class="field-hint" id="term-hint">Die Shell läuft als dein Benutzer – für Root-Befehle <code>sudo</code> verwenden. Nach 30 Min. ohne Eingabe wird sie geschlossen.</p>
    </form>
    <div class="terminal-box" id="terminal" hidden></div>
  </main>
  <script src="/static/i18n.js"></script>
  <script src="/static/perms.js"></script>
  <script src="/static/caps.js"></script>
  <script src="/static/hosts.js"></script>

  <script src="/static/vendor/xterm/xterm.js"></script>
  <script src="/static/vendor/xterm/addon-fit.js"></script>
  <script src="/static/terminal.js"></script>
  <script src="/static/sidebar.js"></script>
  <script src="/static/palette.js"></script>
</body>
</html>
