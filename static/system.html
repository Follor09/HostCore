<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System-Werkzeuge | PiCore Server</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-cyber settings-page">
  <div class="ambient-glow glow-cyan"></div>
  <div class="ambient-glow glow-violet"></div>

  <header class="app-header">
    <div class="header-left">
      <a class="back-link" href="/" title="Zurück zum Dashboard">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
        <span>Dashboard</span>
      </a>
      <h1 class="settings-title">System-Werkzeuge</h1>
    </div>
    <div class="header-right">
      <div class="user-chip" id="user-chip" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span id="user-name"></span>
      </div>
    </div>
  </header>

  <main class="settings-layout">
    <nav class="settings-nav" aria-label="Bereiche">
      <a href="#netzwerk" class="active">Netzwerk</a>
      <a href="#hardware">Hardware</a>
    </nav>

    <div class="settings-sections">
      <!-- Netzwerk -->
      <section class="glass-card settings-section" id="netzwerk">
        <div class="section-head">
          <h2>Netzwerk</h2>
          <button class="mini-icon-btn" data-reload="network" title="Neu laden">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          </button>
        </div>
        <dl class="kv-grid" id="net-summary"></dl>
        <h3 class="subhead">Schnittstellen</h3>
        <div class="iface-list" id="net-ifaces"></div>
        <label class="toggle-label net-toggle">
          <input type="checkbox" id="net-show-virtual">
          Container- &amp; Loopback-Schnittstellen anzeigen
        </label>
        <h3 class="subhead">Offene Ports</h3>
        <div class="table-scroll">
          <table class="data-table" id="net-ports"></table>
        </div>
        <p class="field-hint" id="net-ports-hint"></p>
      </section>

      <!-- Hardware -->
      <section class="glass-card settings-section" id="hardware">
        <div class="section-head">
          <h2>Hardware</h2>
          <button class="mini-icon-btn" data-reload="hardware" title="Neu laden">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          </button>
        </div>
        <dl class="kv-grid" id="hw-summary"></dl>
        <h3 class="subhead">Laufwerke</h3>
        <div class="iface-list" id="hw-storage"></div>
        <h3 class="subhead">USB-Geräte</h3>
        <div class="iface-list" id="hw-usb"></div>
      </section>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>
  <script src="/static/system.js"></script>
</body>
</html>
