<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <title>Status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-cyber">
  <div class="ambient-glow glow-cyan"></div>
  <div class="ambient-glow glow-violet"></div>

  <main class="status-page">
    <div class="status-head">
      <h1 id="sp-title" data-no-i18n>Status</h1>
    </div>
    <p class="status-desc" id="sp-desc" data-no-i18n></p>
    <div class="status-banner" id="sp-banner" role="status" aria-live="polite">Lade…</div>
    <div class="glass-card status-list" id="sp-list" hidden></div>
    <p class="status-foot" id="sp-foot"></p>
  </main>

  <script src="/static/i18n.js"></script>
  <script src="/static/status.js"></script>
</body>
</html>
