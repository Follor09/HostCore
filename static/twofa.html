<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <title>Zwei-Faktor-Anmeldung | PiCore Server</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-cyber login-page">
  <div class="ambient-glow glow-cyan"></div>
  <div class="ambient-glow glow-violet"></div>

  <main class="login-wrap">
    <div class="glass-card login-card twofa-card">
      <div class="login-brand">
        <div class="card-icon-pill icon-cyan">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"></rect><path d="M12 18h.01"></path></svg>
        </div>
        <div>
          <h1>Zwei-Faktor-Anmeldung</h1>
          <p class="card-subtitle">Für dein Konto vorgeschrieben – einmal einrichten, dann geht es weiter.</p>
        </div>
      </div>
      <div id="twofa-box"></div>
      <button type="button" class="login-lang" id="twofa-logout">Abmelden</button>
    </div>
  </main>
  <div class="toast-container" id="toast-container"></div>
  <script src="/static/i18n.js"></script>
  <script src="/static/twofa.js"></script>
  <script src="/static/twofa-page.js"></script>
