<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PiCore">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <script src="/static/theme.js"></script>
  <title>Anmelden | PiCore Server</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="theme-cyber login-page">
  <div class="ambient-glow glow-cyan"></div>
  <div class="ambient-glow glow-violet"></div>

  <main class="login-wrap">
    <form class="glass-card login-card" id="login-form" novalidate>
      <div class="login-brand">
        <div class="card-icon-pill icon-cyan">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <div>
          <h1>PiCore Server</h1>
          <p class="card-subtitle">Anmelden, um das Dashboard zu verwenden</p>
        </div>
      </div>

      <div class="login-notice" id="login-notice" hidden></div>

      <label class="login-field">
        <span>Benutzername</span>
        <input type="text" id="login-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>

      <label class="login-field">
        <span>Passwort</span>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>
      </label>

      <label class="login-field" id="login-code-field" hidden>
        <span>Code aus der Authenticator-App</span>
        <input type="text" id="login-code" name="code" autocomplete="one-time-code" inputmode="numeric" spellcheck="false" maxlength="12" placeholder="123456">
        <span class="field-hint">Oder einen Wiederherstellungscode wie 4f7k-2m9q.</span>
      </label>

      <label class="toggle-label login-remember">
        <input type="checkbox" id="login-remember" checked>
        Angemeldet bleiben (30 Tage)
      </label>

      <div class="login-error" id="login-error" role="alert" hidden></div>

      <button type="submit" class="login-submit" id="login-submit">Anmelden</button>

      <a class="login-public" id="login-public" href="/" hidden>Nur ansehen, ohne Anmeldung →</a>
      <button type="button" class="login-lang" id="login-lang" data-no-i18n></button>
    </form>
  </main>
  <script src="/static/i18n.js"></script>
  <script src="/static/footer.js"></script>

  <script src="/static/login.js"></script>
</body>
</html>
