# tmux settings for the dashboard's web terminal (own server: tmux -L picore).
# tmux only keeps the shell alive while no browser is connected - it should not show itself.
set -g status off
set -g history-limit 20000
set -g escape-time 10
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# No alternate screen: the output stays in the browser's own scrollback (mouse wheel, selecting)
set -ga terminal-overrides ",xterm*:smcup@:rmcup@"
set -g mouse off
set -g set-clipboard on
set -g destroy-unattached off
set -g detach-on-destroy on
# Size follows the connected browser window
setw -g aggressive-resize on
set -g window-size latest
# No key bindings of its own: Ctrl+B belongs to the shell
unbind-key -a
set -g prefix None
set -g prefix2 None
