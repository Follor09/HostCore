name: Feature idea
description: Suggest something PiCore should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: The task or problem – not only the solution you have in mind
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it look in PiCore?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you solve it today?
